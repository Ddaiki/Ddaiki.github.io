<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAT図像ブラウザ（叩き台）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="topbar">
    <button id="menu-toggle" class="icon-btn" aria-label="メニュー">☰</button>
    <h1 class="brand">SAT図像ブラウザ</h1>
    <form id="search-form" class="search">
      <input id="search-input" type="search" placeholder="キーワードで検索" autocomplete="off">
      <button type="submit">検索</button>
    </form>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <section class="facet">
        <h2>絞り込み</h2>
        <ul id="facet-deity" class="facet-list"></ul>
      </section>
      <p class="credit">
        画像出典: <a href="https://dzkimgs.l.u-tokyo.ac.jp/SATi/images.php" target="_blank" rel="noopener">SAT大正蔵図像DB</a>（東京大学 / CC BY-SA 4.0）<br>
        本フロントは<strong>非公式の叩き台</strong>です。
      </p>
    </aside>

    <main class="main">
      <div id="status" class="status" hidden></div>
      <ul id="results" class="grid" aria-live="polite"></ul>
      <div class="pager">
        <button id="prev-page" disabled>← 前へ</button>
        <span id="page-info">—</span>
        <button id="next-page" disabled>次へ →</button>
      </div>
    </main>
  </div>

  <div id="viewer-modal" class="modal" hidden>
    <div class="modal-inner">
      <button id="viewer-close" class="icon-btn modal-close" aria-label="閉じる">×</button>
      <div class="viewer-nav-bar">
        <button id="viewer-prev" class="icon-btn" aria-label="前へ">‹</button>
        <h2 id="viewer-title">—</h2>
        <button id="viewer-next" class="icon-btn" aria-label="次へ">›</button>
      </div>
      <div id="viewer" class="viewer"></div>
      <dl id="viewer-meta" class="meta"></dl>
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
